name: Django API Code Quality Assurance

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  linter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar UV
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias
        run: uv sync

      - name: Ejecutar isort
        run: uv run isort --check-only --profile black .

      - name: Ejecutar flake8
        run: uv run flake8 .